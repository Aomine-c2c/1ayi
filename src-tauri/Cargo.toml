[package]
name = "ayi-tauri"
version = "1.0.0"
description = "Agricultural Yield Intelligence System — Desktop Application"
authors = ["AYIS"]
edition = "2021"

[lib]
name = "ayi_tauri"
path = "src/lib.rs"

[[bin]]
name = "ayi-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
